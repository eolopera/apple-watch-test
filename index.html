<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Padel Score v7.1</title>
<style>
*{box-sizing:border-box}html{background:#000}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;text-align:center;padding:8px 7px 28px}main{max-width:380px;margin:auto}.top{font-size:15px;font-weight:900;color:#b1ffd0;margin:3px 0 7px}.status{font-size:15px;font-weight:800;margin-bottom:8px;min-height:20px}.team{background:#131b23;border:2px solid #55ef93;border-radius:17px;padding:10px 7px;margin:9px 0}.team.rival{border-color:#78a8ff}.name{font-size:21px;font-weight:900;margin-bottom:9px}.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;align-items:center}.score-label{font-size:12px;font-weight:900;color:#d2d9e0;letter-spacing:0}.score-number{font-size:clamp(45px,24.75vw,90px);line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-2px;white-space:nowrap;min-width:0}.point-number{color:#8cffb9}.rival .point-number{color:#fff}.side{color:#ffd36c}.score-grid .score-number{font-size:clamp(45px,24.75vw,90px)}.add,.action{display:block;width:100%;min-height:70px;padding:10px 4px;border:0;border-radius:14px;color:#fff;font-family:inherit;font-size:23px;font-weight:900;touch-action:manipulation;cursor:pointer}.add{background:#147d40;margin-top:11px}.rival .add{background:#245caa}.actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.action{background:#344456}.action.new{background:#6b3030}.action.confirm{background:#b44228}.action.cancel{background:#344456}button:disabled{opacity:.35}.sets{font-size:17px;font-weight:800;line-height:1.5;margin:11px 0;overflow-wrap:anywhere}.hint{font-size:12px;color:#c7cbd2;margin:12px 0}.hidden{display:none!important}
</style>
</head>
<body>
<main>
<div class="top">🎾 PADEL SCORE V7</div>
<div id="status" class="status" aria-live="polite">Partido en curso</div>
<section class="team"><div class="name">NOSOTROS</div><div class="score-grid"><div class="score-label">S</div><div class="score-label">G</div><div id="sets0" class="score-number">0</div><div id="games0" class="score-number">0</div><div class="score-label">P</div><div class="score-label">LADO</div><div id="point0" class="score-number point-number">0</div><div id="side0" class="score-number side">D</div></div><button class="add" onclick="addPoint(0)">+ PUNTO</button></section>
<section class="team rival"><div class="name">RIVALES</div><div class="score-grid"><div class="score-label">S</div><div class="score-label">G</div><div id="sets1" class="score-number">0</div><div id="games1" class="score-number">0</div><div class="score-label">P</div><div class="score-label">LADO</div><div id="point1" class="score-number point-number">0</div><div id="side1" class="score-number side">D</div></div><button class="add" onclick="addPoint(1)">+ PUNTO</button></section>
<div id="setsHistory" class="sets">Sets: —</div>
<div class="actions"><button id="undo" class="action" onclick="undo()">↶ DESHACER</button><button id="newButton" class="action new" onclick="requestNewMatch()">NUEVO PARTIDO</button><button id="confirmButton" class="action confirm hidden" onclick="confirmNewMatch()">SÍ, REINICIAR TODO</button><button id="cancelButton" class="action cancel hidden" onclick="cancelNewMatch()">CANCELAR</button></div>
<p class="hint">Marcador guardado en este navegador.</p>
</main>
<script>
'use strict';
// Reutiliza los datos de las versiones 3 y 4.
const KEY='padel-score-v3';
const names=['Nosotros','Rivales'];
function initial(){return {points:[0,0],games:[0,0],sets:[],tb:false,finished:false,history:[]};}
let state=initial();
let pendingReset=false;
try{
 const saved=JSON.parse(localStorage.getItem(KEY));
 if(saved && Array.isArray(saved.points) && saved.points.length===2 && Array.isArray(saved.games) && saved.games.length===2 && Array.isArray(saved.sets) && Array.isArray(saved.history) && typeof saved.tb==='boolean' && typeof saved.finished==='boolean') state=saved;
}catch(e){}
function snapshot(){return {points:[...state.points],games:[...state.games],sets:state.sets.map(s=>[...s]),tb:state.tb,finished:state.finished};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function setWins(team){return state.sets.filter(s=>s[team]>s[1-team]).length;}
function finishSet(team){state.sets.push([...state.games]);state.games=[0,0];state.points=[0,0];state.tb=false;if(setWins(team)>=2)state.finished=true;}
function addPoint(team){
 if(state.finished || pendingReset)return;
 state.history.push(snapshot());
 state.points[team]++;
 const other=1-team;
 if(state.tb){
  if(state.points[team]>=7 && state.points[team]-state.points[other]>=2){state.games[team]++;finishSet(team);}
 }else if(state.points[team]>=4 && state.points[team]-state.points[other]>=2){
  state.points=[0,0];state.games[team]++;
  if(state.games[team]>=6 && state.games[team]-state.games[other]>=2)finishSet(team);
  else if(state.games[0]===6 && state.games[1]===6)state.tb=true;
 }
 save();render();
}
function undo(){if(!state.history.length || pendingReset)return;const previous=state.history.pop();Object.assign(state,previous);save();render();}
function requestNewMatch(){pendingReset=true;render();}
function cancelNewMatch(){pendingReset=false;render();}
function confirmNewMatch(){state=initial();pendingReset=false;save();render();}
function pointLabels(){
 if(state.tb)return state.points.map(String);
 const [a,b]=state.points;
 if(a>=3 && b>=3){if(a===b)return ['40','40'];return a>b?['AD','40']:['40','AD'];}
 const labels=['0','15','30','40'];return [labels[Math.min(a,3)],labels[Math.min(b,3)]];
}
function render(){
 const labels=pointLabels();
 // El lado depende del total de puntos disputados en el juego/tie-break actual.
 const side=(state.points[0]+state.points[1])%2===0?'D':'I';
 for(let i=0;i<2;i++){
  document.getElementById('sets'+i).textContent=setWins(i);
  document.getElementById('games'+i).textContent=state.games[i];
  document.getElementById('point'+i).textContent=labels[i];
  document.getElementById('side'+i).textContent=side;
 }
 document.getElementById('status').textContent=pendingReset?'¿REINICIAR EL PARTIDO?':state.finished?'🏆 Ganaron: '+names[setWins(0)===2?0:1]:state.tb?'TIE-BREAK':'Partido en curso';
 document.getElementById('setsHistory').textContent='Sets: '+(state.sets.length?state.sets.map((s,i)=>'S'+(i+1)+': '+s[0]+'-'+s[1]).join(' | '):'—');
 document.querySelectorAll('.add').forEach(b=>b.disabled=state.finished||pendingReset);
 document.getElementById('undo').disabled=!state.history.length||pendingReset;
 document.getElementById('newButton').classList.toggle('hidden',pendingReset);
 document.getElementById('confirmButton').classList.toggle('hidden',!pendingReset);
 document.getElementById('cancelButton').classList.toggle('hidden',!pendingReset);
}
render();
</script>
</body>
</html>
