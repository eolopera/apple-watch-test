
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 12px 4px;
    }

    h2 {
      font-size: 18px;
      margin: 8px 0;
    }

    #contador {
      font-size: 54px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      font-size: 20px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      margin: 5px;
      cursor: pointer;
    }

    .sumar {
      background: #30d158;
      color: black;
    }

    .reiniciar {
      background: #444;
      color: white;
    }
  </style>
</head>

<body>
  <h2>Mi Apple Watch</h2>

  <div id="contador">0</div>

  <button class="sumar" onclick="sumar()">
    +1
  </button>

  <button class="reiniciar" onclick="reiniciar()">
    Reset
  </button>

  <script>
    let contador = 0;

    function sumar() {
      contador++;
      document.getElementById('contador')
        .textContent = contador;
    }

    function reiniciar() {
      contador = 0;
      document.getElementById('contador')
        .textContent = contador;
    }
  </script>
</body>
</html>
