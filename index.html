
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Watch Trainer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h2 { font-size: 18px; margin: 8px 0; }
    #contador {
      color: #30d158;
      font-size: 52px;
      margin: 12px 0;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      margin: 3px;
      color: white;
      background: #444;
    }
    .sumar { background: #248a3d; }
    .guardar { background: #0a84ff; }
    #historial {
      font-size: 13px;
      color: #ccc;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Dominadas</h2>
  <div id="contador">0</div>

  <button onclick="cambiar(-1)">-</button>
  <button class="sumar" onclick="cambiar(1)">+1</button>

  <p>
    <button class="guardar" onclick="guardar()">
      Guardar serie
    </button>
  </p>

  <div id="historial"></div>
  <p id="total"></p>

  <button onclick="reiniciar()">Reiniciar</button>

  <script>
    let contador = 0;
    let series = [];

    try {
      const guardado = localStorage.getItem('series');
      if (guardado) {
        const datos = JSON.parse(guardado);
        if (Array.isArray(datos)) {
          series = datos.filter(n =>
            Number.isInteger(n) && n > 0
          );
        }
      }
    } catch (e) {
      // El navegador puede bloquear el almacenamiento.
    }

    function cambiar(valor) {
      contador = Math.max(0, contador + valor);
      actualizar();
    }

    function guardar() {
      if (contador === 0) return;
      series.push(contador);
      contador = 0;
      persistir();
      actualizar();
    }

    function persistir() {
      try {
        localStorage.setItem(
          'series', JSON.stringify(series)
        );
      } catch (e) {}
    }

    function reiniciar() {
      if (!confirm('¿Reiniciar sesión?')) return;
      contador = 0;
      series = [];
      persistir();
      actualizar();
    }

    function actualizar() {
      document.getElementById('contador')
        .textContent = contador;

      document.getElementById('historial')
        .textContent = series.length
          ? 'Series: ' + series.join(' - ')
          : 'Sin series registradas';

      const total = series.reduce(
        (suma, n) => suma + n, 0
      ) + contador;

      document.getElementById('total')
        .textContent = 'Total: ' + total;
    }

    actualizar();
  </script>
</body>
</html>
